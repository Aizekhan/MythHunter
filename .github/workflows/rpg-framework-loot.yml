name: RPG Framework - Loot Module

on:
  push:
    branches: [ dev, 'feature/epic11-phase3-*' ]
    paths:
      - 'Assets/_Framework/Loot/**'
      - 'Build/RPGFramework.Loot.*/**'
      - 'Build/validate_framework_loot_boundary.py'
  pull_request:
    branches: [ dev ]
    paths:
      - 'Assets/_Framework/Loot/**'
      - 'Build/RPGFramework.Loot.*/**'
      - 'Build/validate_framework_loot_boundary.py'

jobs:
  test-loot-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Boundary Validation
        run: python Build/validate_framework_loot_boundary.py

      - name: Restore Dependencies
        run: dotnet restore Build/RPGFramework.Loot.Tests/RPGFramework.Loot.Tests.csproj

      - name: Build
        run: dotnet build Build/RPGFramework.Loot.Tests/RPGFramework.Loot.Tests.csproj --no-restore

      - name: Run Tests
        run: dotnet test Build/RPGFramework.Loot.Tests/RPGFramework.Loot.Tests.csproj --no-build --verbosity normal
