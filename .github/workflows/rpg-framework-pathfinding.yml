name: RPGFramework Pathfinding Runtime

on:
  pull_request:
    branches: [dev]
    paths:
      - "Assets/_Framework/Pathfinding/**"
      - "Build/RPGFramework.Pathfinding.Tests/**"
      - ".github/workflows/rpg-framework-pathfinding.yml"
  push:
    branches: [dev]
    paths:
      - "Assets/_Framework/Pathfinding/**"
      - "Build/RPGFramework.Pathfinding.Tests/**"
      - ".github/workflows/rpg-framework-pathfinding.yml"

permissions:
  contents: read

jobs:
  runtime-tests:
    name: Pure .NET compile and Pathfinding tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run Pathfinding tests
        run: dotnet test Build/RPGFramework.Pathfinding.Tests/RPGFramework.Pathfinding.Tests.csproj --configuration Release
